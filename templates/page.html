<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} | {{name}}</title>
<meta name="description" content="{{description}}">
<meta name="author" content="{{name}}">
<meta name="theme-color" content="#142b3b">
<link rel="canonical" href="{{canonical}}">
<meta property="og:title" content="{{title}} | {{name}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="article">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{base}}/og-personal.png">
<meta property="og:image:alt" content="Software engineering and architecture portfolio">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}} | {{name}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{base}}/og-personal.png">
<script type="application/ld+json">{{structured_data}}</script>
<link rel="stylesheet" href="/portfolio.css?v={{portfolio.css_version}}">
<script src="/portfolio.js?v={{portfolio.js_version}}" defer></script>
<script src="/portfolio-enhancements.js?v={{portfolio-enhancements.js_version}}" defer></script>
</head>
<body class="case-page">
<a href="#main-content" class="skip-link">Skip to main content</a>
{{header}}
<main id="main-content" tabindex="-1">{{body}}</main>
{{footer}}
</body>
</html>
