<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 850" role="img" aria-labelledby="title desc"><title id="title">Keystone · authentication, federation and authorization</title><desc id="desc">Keycloak authenticates users. Google workforce federation trusts that external identity and, through Security Token Service, exchanges a credential for short-lived access. Google IAM controls resource permissions, while Keystone platform policies are a separate scope.</desc>
<defs><marker id="sync" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147D83"/></marker><marker id="event" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#355AD8"/></marker><marker id="store" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9A6700"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#142B3B;font-size:18px}.heading{font-size:30px;font-weight:700}.lane{font-size:19px;font-weight:700;letter-spacing:.8px}.name{font-size:21px;font-weight:700}.minor{fill:#476071}.label{font-size:17px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:7;stroke-linejoin:round}.sync{stroke:#147D83}.event{stroke:#355AD8;stroke-dasharray:8 6}.store{stroke:#9A6700}</style><rect width="1160" height="850" fill="#fff"/>
<text x="34" y="47" class="heading">Keystone · authentication, federation and authorization</text>
<text x="34" y="80" class="minor">Trust-boundary view · Google product flow distinguished from project configuration</text>
<rect x="28" y="110" width="1104" height="145" rx="10" fill="#F5F8FB" stroke="#BACBD5" stroke-dasharray="8 6"/>
<text x="48" y="139" class="lane">EXTERNAL IDENTITY PROVIDER</text>
<text x="1110" y="139" class="minor" text-anchor="end">Keycloak authenticates the workforce user</text>
<rect x="65" y="162" width="315" height="83" rx="7" fill="#fff" stroke="#718997" stroke-width="1.5"/>
<text x="82" y="192" class="name">Workforce user</text>
<text x="82" y="219" class="minor">Human identity</text>
<rect x="650" y="162" width="430" height="83" rx="7" fill="#fff" stroke="#718997" stroke-width="1.5"/>
<text x="667" y="192" class="name">Keycloak</text>
<text x="667" y="219" class="minor">OpenID Connect identity provider</text>
<path d="M380 202.0H650" fill="none" stroke-width="2.4" class="sync" marker-end="url(#sync)"/>
