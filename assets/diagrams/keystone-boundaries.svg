<text x="48" y="332" class="lane">GOOGLE FEDERATION TRUST BOUNDARY</text>
<text x="1110" y="332" class="minor" text-anchor="end">Pool / provider configuration</text>
<rect x="65" y="357" width="430" height="83" rx="7" fill="#fff" stroke="#718997" stroke-width="1.5"/>
<text x="82" y="387" class="name">Workforce identity provider</text>
<text x="82" y="414" class="minor">Federated identity trust</text>
<rect x="650" y="357" width="430" height="83" rx="7" fill="#fff" stroke="#718997" stroke-width="1.5"/>
<text x="667" y="387" class="name">Security Token Service</text>
<text x="667" y="414" class="minor">Google product credential exchange</text>
<path d="M865 245.0V280.0H280V357.0" fill="none" stroke-width="2.4" class="sync" marker-end="url(#sync)"/>
<text x="567" y="278" class="label" text-anchor="middle">external credential</text>
