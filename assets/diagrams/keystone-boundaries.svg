<text x="572" y="381" class="label" text-anchor="middle">exchange</text>
<rect x="28" y="518" width="1104" height="153" rx="10" fill="#F5F8FB" stroke="#BACBD5" stroke-dasharray="8 6"/>
<text x="48" y="547" class="lane">SEPARATE AUTHORIZATION SCOPES</text>
<text x="1110" y="547" class="minor" text-anchor="end">Identity federation does not itself grant every permission</text>
<rect x="65" y="587" width="430" height="83" rx="7" fill="#fff" stroke="#718997" stroke-width="1.5"/>
<text x="82" y="617" class="name">OPA application policies</text>
<text x="82" y="644" class="minor">Policy decisions; gateway enforcement</text>
<rect x="650" y="587" width="430" height="83" rx="7" fill="#fff" stroke="#718997" stroke-width="1.5"/>
<text x="667" y="617" class="name">IAM-controlled cloud resources</text>
<text x="667" y="644" class="minor">Federated user access + allow policies</text>
<path d="M865 440.0V587.0" fill="none" stroke-width="2.4" class="sync" marker-end="url(#sync)"/>
<text x="865" y="495" class="label" text-anchor="middle">short-lived access</text>
<text x="35" y="720" class="minor">STS and short-lived credentials describe Google’s documented product flow, not inspected deployment settings.</text>
<text x="35" y="744" class="minor">Workforce federation concerns user identities. Workload federation and service-account flows are different mechanisms.</text>
