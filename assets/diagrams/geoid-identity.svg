<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 850" role="img" aria-labelledby="title desc"><title id="title">GeoID · identity survives a storage boundary</title><desc id="desc">Catalog and collection references resolve to internal identity. Writable features use UUIDv7 identities and file-backed features use scoped deterministic UUIDv5 identities. Backend IDs remain a separate representation.</desc>
<defs><marker id="sync" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147D83"/></marker><marker id="event" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#355AD8"/></marker><marker id="store" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9A6700"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#142B3B;font-size:18px}.heading{font-size:30px;font-weight:700}.lane{font-size:19px;font-weight:700;letter-spacing:.8px}.name{font-size:21px;font-weight:700}.minor{fill:#476071}.label{font-size:17px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:7;stroke-linejoin:round}.sync{stroke:#147D83}.event{stroke:#355AD8;stroke-dasharray:8 6}.store{stroke:#9A6700}</style><rect width="1160" height="850" fill="#fff"/>
<text x="34" y="47" class="heading">GeoID · identity survives a storage boundary</text>
<text x="34" y="80" class="minor">Canonical feature identity · different policies for writable and file-backed data</text>
<rect x="28" y="110" width="1104" height="145" rx="10" fill="#F5F8FB" stroke="#BACBD5"/>
<text x="48" y="139" class="lane">SOURCE REFERENCES</text>
<text x="1110" y="139" class="minor" text-anchor="end">Names and source keys are not universal feature identity</text>
<rect x="65" y="162" width="430" height="83" rx="7" fill="#fff" stroke="#718997" stroke-width="1.5"/>
<text x="82" y="192" class="name">Writable feature input</text>
<text x="82" y="219" class="minor">Catalog / collection reference</text>
<rect x="650" y="162" width="430" height="83" rx="7" fill="#fff" stroke="#718997" stroke-width="1.5"/>
<text x="667" y="192" class="name">File-backed source feature</text>
<text x="667" y="219" class="minor">Scoped source feature identifier</text>
<rect x="28" y="303" width="1104" height="155" rx="10" fill="#F5F8FB" stroke="#BACBD5"/>
<text x="48" y="332" class="lane">DOMAIN IDENTITY BOUNDARY</text>
<text x="1110" y="332" class="minor" text-anchor="end">Resolve references before persistence</text>
<rect x="65" y="357" width="430" height="83" rx="7" fill="#fff" stroke="#718997" stroke-width="1.5"/>
<text x="82" y="387" class="name">New writable identity</text>
<text x="82" y="414" class="minor">UUIDv7</text>
<rect x="650" y="357" width="430" height="83" rx="7" fill="#fff" stroke="#718997" stroke-width="1.5"/>
<text x="667" y="387" class="name">Deterministic file identity</text>
<text x="667" y="414" class="minor">UUIDv5: catalog + collection + source ID</text>
<path d="M280 245.0V357.0" fill="none" stroke-width="2.4" class="sync" marker-end="url(#sync)"/>
<text x="280" y="287" class="label" text-anchor="middle">resolve / assign</text>
<path d="M865 245.0V357.0" fill="none" stroke-width="2.4" class="sync" marker-end="url(#sync)"/>
<text x="865" y="287" class="label" text-anchor="middle">derive in scope</text>
<rect x="28" y="518" width="1104" height="153" rx="10" fill="#F5F8FB" stroke="#BACBD5"/>
<text x="48" y="547" class="lane">PHYSICAL REPRESENTATIONS</text>
<text x="1110" y="547" class="minor" text-anchor="end">Canonical IDs are distinct from backend names</text>
<rect x="65" y="587" width="430" height="83" rx="7" fill="#fff" stroke="#718997" stroke-width="1.5"/>
<text x="82" y="617" class="name">PostgreSQL feature storage</text>
<text x="82" y="644" class="minor">Canonical feature ID</text>
<rect x="650" y="587" width="430" height="83" rx="7" fill="#fff" stroke="#718997" stroke-width="1.5"/>
<text x="667" y="617" class="name">Backend representations</text>
<text x="667" y="644" class="minor">Physical keys / search document IDs</text>
<path d="M280 440.0V587.0" fill="none" stroke-width="2.4" class="store" marker-end="url(#store)"/>
<text x="280" y="495" class="label" text-anchor="middle">persist identity</text>
<path d="M865 440.0V480.0H510V626.0H650" fill="none" stroke-width="2.4" class="sync" marker-end="url(#sync)"/>
<text x="510" y="494" class="label" text-anchor="middle">identity mapping</text>
<text x="35" y="720" class="minor">UUIDv7 does not prove global transaction order. UUIDv5 stability depends on the defined source scope.</text>
<text x="35" y="744" class="minor">Identity resolution is distinct from authorization and from the availability of a public resolver.</text>
<rect x="40" y="117" width="211" height="32" fill="#F5F8FB"/>
