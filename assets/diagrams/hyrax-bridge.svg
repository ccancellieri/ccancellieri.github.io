<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 850" role="img" aria-labelledby="title desc"><title id="title">Hyrax SQL Handler · bridge two data models</title><desc id="desc">A scientific client requests a dataset through Hyrax and BES. The SQL Handler maps database results through ODBC to the data access protocol. Database driver configuration and types remain explicit boundaries.</desc>
