<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 850" role="img" aria-labelledby="title desc"><title id="title">CKAN · the separately described integration</title><desc id="desc">The candidate account describes a separate Eventarc integration serving Elasticsearch, Solr and object storage. Exact event source, authoritative record and bucket role are unverified; no outbox or reconciliation implementation is asserted.</desc>
