<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 850" role="img" aria-labelledby="title desc"><title id="title">Keystone · federated identity, two authorization scopes</title><desc id="desc">Applications authenticate through Keycloak. A Google Cloud workforce identity pool/provider federates user identities for IAM resource access. Open Policy Agent provides application decisions for gateway/platform enforcement, separately from Google IAM.</desc>
