<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 850" role="img" aria-labelledby="title desc"><title id="title">GeoServer · a configuration change crosses boundaries</title><desc id="desc">An authorized edit is persisted on the writer and sent through JMS. The replica consumes configuration, applies it in memory and persists locally. The publish/persist atomicity is not established.</desc>
