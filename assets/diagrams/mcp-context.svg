<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 850" role="img" aria-labelledby="title desc"><title id="title">MCP Skill Hub · evidence without rewriting intent</title><desc id="desc">The original request reaches the coding client unchanged. Explicit MCP retrieval or an opt-in prompt hook retrieves bounded project evidence. Background indexing stays outside the request path and supplemental evidence is not authorization.</desc>
