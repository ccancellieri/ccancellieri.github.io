<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 850" role="img" aria-labelledby="title desc"><title id="title">Tellurion · native serving with explicit capabilities</title><desc id="desc">One native Rust engine exposes geospatial API surfaces through configured storage drivers. GeoPackage is the embedded default; PostGIS is an optional database path; raster and file sources have their own capabilities.</desc>
