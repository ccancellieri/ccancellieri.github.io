<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 850" role="img" aria-labelledby="title desc"><title id="title">GeoServer · three independent responsibilities</title><desc id="desc">OGC traffic reaches two serving nodes, while a designated authoring node propagates configuration via JMS. Spatial data has a separate management strategy.</desc>
