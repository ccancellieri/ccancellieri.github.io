<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790" role="img" aria-labelledby="title desc">
<title id="title">Geospatial cloud delivery: product, infrastructure and release responsibility</title>
<desc id="desc">Software releases produce setup and resource artifacts. Terraform changes produce tagged modules and review infrastructure. Both enter review. Tester checks support a supervised production change with a DevOps pair session and a managed instance group rollout. This is an abstract delivery workflow, not an inventory of cloud resources.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#147D83"/></marker><marker id="decision-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#9A6700"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#142B3B}.title{font-size:29px;font-weight:700}.subtitle{font-size:18px}.lane{font-size:18px;font-weight:700;letter-spacing:1px}.node-title{font-size:20px;font-weight:700}.body{font-size:18px}.caption{font-size:17px}.node{fill:white;stroke:#B6CDD6;stroke-width:1.5;rx:9}.flow{fill:none;stroke:#147D83;stroke-width:2.5;marker-end:url(#arrow)}.decision{fill:none;stroke:#9A6700;stroke-width:2.5;marker-end:url(#decision-arrow)}</style>
<rect width="1100" height="790" fill="#F5F8FB"/>
<text x="35" y="45" class="title">Two release streams, one review decision</text>
<text x="35" y="77" class="subtitle">Abstract workflow reconstructed from the original GCP geospatial delivery slides</text>
<rect x="24" y="112" width="1030" height="152" rx="12" fill="#E9F4F4"/>
<text x="40" y="140" class="lane">PRODUCT RELEASE</text>
<rect x="40" y="157" width="190" height="87" class="node"/>
<text x="55" y="184" class="node-title">Product change</text><text x="55" y="212" class="body">GeoServer, CKAN</text><text x="55" y="234" class="body">or GeoNetwork</text>
<rect x="280" y="157" width="190" height="87" class="node"/>
<text x="295" y="184" class="node-title">Product pipeline</text><text x="295" y="214" class="body">Independent</text><text x="295" y="236" class="body">release cycle</text>
<rect x="520" y="157" width="210" height="87" class="node"/>
<text x="535" y="184" class="node-title">Release artifacts</text><text x="535" y="213" class="body">setup.sh</text><text x="535" y="236" class="body">resources.tar.gz</text>
<rect x="780" y="157" width="240" height="87" class="node"/>
<text x="795" y="184" class="node-title">Deploy in review</text><text x="795" y="213" class="body">Fetch the selected</text><text x="795" y="236" class="body">product artifacts</text>
<path d="M230 201H275" class="flow"/><path d="M470 201H515" class="flow"/><path d="M730 201H775" class="flow"/>
<rect x="24" y="291" width="1030" height="152" rx="12" fill="#EAF0FC"/>
<text x="40" y="319" class="lane">INFRASTRUCTURE CHANGE</text>
<rect x="40" y="336" width="190" height="87" class="node"/>
<text x="55" y="363" class="node-title">Terraform change</text><text x="55" y="393" class="body">Reusable</text><text x="55" y="415" class="body">modules</text>
<rect x="280" y="336" width="190" height="87" class="node"/>
<text x="295" y="363" class="node-title">Tagged modules</text><text x="295" y="393" class="body">Reproducible</text><text x="295" y="415" class="body">release inputs</text>
<rect x="520" y="336" width="210" height="87" class="node"/>
<text x="535" y="363" class="node-title">Review integration</text><text x="535" y="393" class="body">Deploy, integrate</text><text x="535" y="415" class="body">and test</text>
<rect x="780" y="336" width="240" height="87" class="node"/>
<text x="795" y="363" class="node-title">Review environment</text><text x="795" y="393" class="body">Isolated from</text><text x="795" y="415" class="body">production changes</text>
<path d="M230 380H275" class="flow"/><path d="M470 380H515" class="flow"/><path d="M730 380H775" class="flow"/>
<rect x="24" y="514" width="1030" height="165" rx="12" fill="#FAF0DF"/>
<text x="40" y="537" class="lane">RELEASE RESPONSIBILITY</text>
<rect x="40" y="550" width="190" height="106" class="node"/>
<text x="55" y="578" class="node-title">Developer review</text><text x="55" y="607" class="body">Autonomous</text><text x="55" y="630" class="body">deployment and</text><text x="55" y="652" class="body">experiments</text>
<rect x="280" y="550" width="190" height="106" class="node"/>
<text x="295" y="578" class="node-title">Tester checks</text><text x="295" y="607" class="body">Service tests</text><text x="295" y="630" class="body">before promotion</text>
<rect x="520" y="550" width="210" height="106" class="node"/>
<text x="535" y="578" class="node-title" style="font-size:18px">DevOps pair session</text><text x="535" y="607" class="body">Authorise and</text><text x="535" y="630" class="body">supervise the</text><text x="535" y="652" class="body">production change</text>
<rect x="780" y="550" width="240" height="106" class="node"/>
<text x="795" y="578" class="node-title">Production rollout</text><text x="795" y="607" class="body">Instance template,</text><text x="795" y="630" class="body">fresh disks and</text><text x="795" y="652" class="body">managed group update</text>
<path d="M230 603H275" class="decision"/><path d="M470 603H515" class="decision"/><path d="M730 603H775" class="decision"/>
<path d="M1020 201H1070V484H375V546" class="flow"/>
<path d="M1020 380H1070" fill="none" stroke="#147D83" stroke-width="2.5"/>
<text x="455" y="476" class="caption">Both streams supply review evidence</text>
<text x="35" y="714" class="caption">Teal: release inputs and review evidence. Ochre: responsibility for the release decision.</text>
<text x="35" y="742" class="caption">The source describes rolling updates after primary-instance changes. This is separate from JMS propagation.</text>
<text x="35" y="770" class="caption">Source: complete 19-slide GCP geospatial cluster presentation, especially slides 4–6, 8–14 and 17.</text>
</svg>
