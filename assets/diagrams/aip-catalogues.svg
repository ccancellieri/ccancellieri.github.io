<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 850" role="img" aria-labelledby="title desc"><title id="title">AIP catalogues · two discovery responsibilities</title><desc id="desc">CKAN and JSON Schema support descriptive ISO metadata workflows and a Solr projection. SFEOS supports STAC item and collection discovery through a configured Elasticsearch or OpenSearch backend and returns asset references. The two lanes are distinct and no synchronization between them is asserted.</desc>
