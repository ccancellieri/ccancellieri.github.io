<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 850" role="img" aria-labelledby="title desc"><title id="title">DynaStore · the bulk transaction stops at the outbox</title><desc id="desc">Canonical rows, ID or write-ID outbox obligations and a storage-drain task obligation share a transaction in the PostgreSQL bulk path. Workers later reread canonical state and materialize derived indexes. Ordinary upserts use a separate dispatch transaction.</desc>
<defs><marker id="sync" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#147D83"/></marker><marker id="event" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#355AD8"/></marker><marker id="store" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9A6700"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#142B3B;font-size:18px}.heading{font-size:30px;font-weight:700}.lane{font-size:19px;font-weight:700;letter-spacing:.8px}.name{font-size:21px;font-weight:700}.minor{fill:#476071}.label{font-size:17px;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:7;stroke-linejoin:round}.sync{stroke:#147D83}.event{stroke:#355AD8;stroke-dasharray:8 6}.store{stroke:#9A6700}</style><rect width="1160" height="850" fill="#fff"/>
<text x="34" y="47" class="heading">DynaStore · the bulk transaction stops at the outbox</text>
<text x="34" y="80" class="minor">PostgreSQL-primary bulk-upsert contract · external indexes remain asynchronous</text>
<rect x="28" y="110" width="1104" height="165" rx="10" fill="#F5F8FB" stroke="#BACBD5" stroke-dasharray="8 6"/>
<text x="48" y="139" class="lane">ATOMIC BOUNDARY: PG-PRIMARY BULK UPSERT</text>
<text x="1110" y="139" class="minor" text-anchor="end">One managed PostgreSQL transaction</text>
<rect x="65" y="163" width="285" height="83" rx="7" fill="#fff" stroke="#718997" stroke-width="1.5"/>
<text x="82" y="193" class="name">Canonical rows</text>
<text x="82" y="220" class="minor">PostgreSQL / PostGIS</text>
<rect x="480" y="163" width="285" height="83" rx="7" fill="#fff" stroke="#718997" stroke-width="1.5"/>
<text x="497" y="193" class="name">Storage outbox</text>
<text x="497" y="220" class="minor">ID / write-ID obligations</text>
<rect x="860" y="163" width="220" height="83" rx="7" fill="#fff" stroke="#718997" stroke-width="1.5"/>
<text x="877" y="193" class="name">Drain task</text>
<text x="877" y="220" class="minor">Task obligation</text>
<path d="M350 204.0H480" fill="none" stroke-width="2.4" class="store" marker-end="url(#store)"/>
<text x="412" y="189" class="label" text-anchor="middle">atomic write</text>
<path d="M765 204.0H860" fill="none" stroke-width="2.4" class="store" marker-end="url(#store)"/>
<text x="811" y="189" class="label" text-anchor="middle">enqueue</text>
<rect x="28" y="316" width="1104" height="153" rx="10" fill="#F5F8FB" stroke="#BACBD5"/>
<text x="48" y="345" class="lane">AFTER COMMIT</text>
<text x="1110" y="345" class="minor" text-anchor="end">Task claiming, heartbeat and retry-oriented recovery</text>
<rect x="65" y="367" width="285" height="83" rx="7" fill="#fff" stroke="#718997" stroke-width="1.5"/>
<text x="82" y="397" class="name">Worker / drain</text>
<text x="82" y="424" class="minor">Claim pending work</text>
<rect x="480" y="367" width="285" height="83" rx="7" fill="#fff" stroke="#718997" stroke-width="1.5"/>
<text x="497" y="397" class="name">Canonical state reread</text>
<text x="497" y="424" class="minor">Hydrate current content</text>
<rect x="860" y="367" width="220" height="83" rx="7" fill="#fff" stroke="#718997" stroke-width="1.5"/>
<text x="877" y="397" class="name">Derived index</text>
<text x="877" y="424" class="minor">Materialize data</text>
<path d="M970 246.0V294.0H209V367.0" fill="none" stroke-width="2.4" class="event" marker-end="url(#event)"/>
<text x="621" y="291" class="label" text-anchor="middle">asynchronous drain</text>
<path d="M350 407.0H480" fill="none" stroke-width="2.4" class="store" marker-end="url(#store)"/>
<text x="415" y="389" class="label" text-anchor="middle">read IDs</text>
<path d="M765 407.0H860" fill="none" stroke-width="2.4" class="event" marker-end="url(#event)"/>
<text x="812" y="389" class="label" text-anchor="middle">index</text>
<rect x="28" y="518" width="1104" height="153" rx="10" fill="#F5F8FB" stroke="#BACBD5"/>
<text x="48" y="547" class="lane">SEPARATE CONTRACT: ORDINARY UPSERT</text>
<text x="1110" y="547" class="minor" text-anchor="end">Primary write and dispatch do not share this bulk boundary</text>
<rect x="65" y="580" width="285" height="75" rx="7" fill="#fff" stroke="#718997" stroke-width="1.5"/>
<text x="82" y="610" class="name">Primary write</text>
<rect x="480" y="580" width="285" height="75" rx="7" fill="#fff" stroke="#718997" stroke-width="1.5"/>
<text x="497" y="610" class="name">Later dispatch transaction</text>
<rect x="860" y="580" width="220" height="75" rx="7" fill="#fff" stroke="#718997" stroke-width="1.5"/>
<text x="877" y="610" class="name">Index obligation</text>
<path d="M350 611.0H480" fill="none" stroke-width="2.4" class="sync" marker-end="url(#sync)"/>
<text x="415" y="592" class="label" text-anchor="middle">post-write</text>
<path d="M765 611.0H860" fill="none" stroke-width="2.4" class="event" marker-end="url(#event)"/>
<text x="812" y="594" class="label" text-anchor="middle">dispatch</text>
<text x="35" y="720" class="minor">Lightweight obligations avoid making an event payload the authority. Cross-call duplicate obligations can occur.</text>
<text x="35" y="744" class="minor">The bulk guarantee covers pending work, not exactly-once index effects. Unit-test seams are not production proof.</text>
<rect x="40" y="117" width="453" height="32" fill="#F5F8FB"/>
<text x="48" y="139" class="lane">ATOMIC BOUNDARY: PG-PRIMARY BULK UPSERT</text>
<rect x="808" y="117" width="306" height="32" fill="#F5F8FB"/>
<text x="1110" y="139" class="minor" text-anchor="end">One managed PostgreSQL transaction</text>
<rect x="40" y="323" width="156" height="32" fill="#F5F8FB"/>
<text x="48" y="345" class="lane">AFTER COMMIT</text>
<rect x="646" y="323" width="468" height="32" fill="#F5F8FB"/>
<text x="1110" y="345" class="minor" text-anchor="end">Task claiming, heartbeat and retry-oriented recovery</text>
<rect x="40" y="525" width="398" height="32" fill="#F5F8FB"/>
<text x="48" y="547" class="lane">SEPARATE CONTRACT: ORDINARY UPSERT</text>
<rect x="592" y="525" width="522" height="32" fill="#F5F8FB"/>
<text x="1110" y="547" class="minor" text-anchor="end">Primary write and dispatch do not share this bulk boundary</text>
<path d="M36 808h42" stroke-width="2.4" class="sync" marker-end="url(#sync)"/>
<text x="91" y="815" class="">Request / integration</text>
<path d="M385 808h42" stroke-width="2.4" class="event" marker-end="url(#event)"/>
<text x="440" y="815" class="">Message / asynchronous work</text>
<path d="M795 808h42" stroke-width="2.4" class="store" marker-end="url(#store)"/>
<text x="850" y="815" class="">Persistence / data access</text>
</svg>
